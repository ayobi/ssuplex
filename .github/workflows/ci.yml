name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  check:
    name: fmt / clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --locked -- -D warnings

  msrv:
    name: build with the minimum supported Rust (1.85)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked

  test:
    name: tests and smoke test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install HMMER (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y hmmer
      - name: Install HMMER (macOS)
        if: runner.os == 'macOS'
        run: brew install hmmer
      - run: cargo test --all-targets --locked
      - run: cargo build --release --locked
      - run: bash dev/smoke.sh target/release/ssuplex

  quickstart:
    name: README install and quick start, verbatim
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install HMMER
        run: sudo apt-get update && sudo apt-get install -y hmmer
      - name: Cache the Metaxa2 download
        uses: actions/cache@v4
        with:
          path: Metaxa2_2.2.3.tar.gz
          key: metaxa2-2.2.3
      - name: Install SSUplex as in the README
        run: cargo install --locked --path .
      - name: Assemble HMM profiles as in the README
        run: |
          [ -s Metaxa2_2.2.3.tar.gz ] || curl -fL -O https://microbiology.se/sw/Metaxa2_2.2.3.tar.gz
          tar xzf Metaxa2_2.2.3.tar.gz
          dev/assemble_metaxa2_hmms.sh Metaxa2_2.2.3/metaxa2_db hmms
      - name: Run the README quick start and check the result
        run: |
          ssuplex -i Metaxa2_2.2.3/test.fasta -o quickstart/test --hmm-dir hmms --threads 4 2>&1 | tee quickstart.log
          grep -q 'classified 50 of 100 read(s) to an origin' quickstart.log
          cat quickstart/test.summary.txt
      - name: Check that a second run refuses to overwrite
        run: |
          if ssuplex -i Metaxa2_2.2.3/test.fasta -o quickstart/test --hmm-dir hmms > again.log 2>&1; then
            echo "second run overwrote existing results"; exit 1
          fi
          grep -q -- '--force' again.log
      - name: README option list matches ssuplex -h
        run: diff <(awk '/^\$ ssuplex -h$/{f=1;next} f&&/^```$/{exit} f' README.md) <(ssuplex -h)
